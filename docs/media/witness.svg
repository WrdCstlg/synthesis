<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="wt wd">
<title id="wt">A stale read, caught: key k/0</title>
<desc id="wd">linearizable.kv exhausted its search of the 693 operations on k/0 (4,551 states) and found no order a correct register could produce. At that point the register held 253, written by op 4047, and op 4050 (process 5, read) returned 4000237. That value was written by op 3832, which every linearization places before the value the register held. Drawn from verdict.json of run r_2026_11_11_5379.</desc>
